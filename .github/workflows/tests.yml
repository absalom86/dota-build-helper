name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          "DOTA_HELPER_HOME=$env:RUNNER_TEMP/dota-helper-tests" >> $env:GITHUB_ENV
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Unit and UI tests
        run: python -m pytest -q --ignore=tests/test_history.py
      - name: History tests in a separate Qt process
        run: python -m pytest tests/test_history.py -q
