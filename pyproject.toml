[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dota-build-helper"
version = "0.1.2"
description = "Local Dota 2 build companion with sourced match routes"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "mss>=10,<11", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
dota-build-helper = "dota_helper.app:main"

[tool.setuptools.packages.find]
include = ["dota_helper*"]

[tool.setuptools.package-data]
dota_helper = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
